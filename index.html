<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>ExpRE</title>

    <!-- Firebase Analytics -->
    <script type="module">
        import { initializeApp }  from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
        import { getAnalytics, logEvent } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-analytics.js";

        const firebaseConfig = {
            apiKey:            "AIzaSyDGkLVcgETE4lJqGUW-Kcn9Idh59hsVteM",
            authDomain:        "indiatodaygames.firebaseapp.com",
            projectId:         "indiatodaygames",
            storageBucket:     "indiatodaygames.firebasestorage.app",
            messagingSenderId: "592604808354",
            appId:             "1:592604808354:web:e9cd654980ddcdb49ac3fb",
            measurementId:     "G-3GFGKBQHDQ"
        };

        const app       = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);

        window._logEvent = (eventName, params) => {
            try { logEvent(analytics, eventName, params); } catch(e) { console.warn('[Firebase]', e); }
        };

        const urlParams = new URLSearchParams(window.location.search);
        window._logEvent('ar_launch', {
            campaign_id:  urlParams.get('id')           || 'unknown',
            utm_source:   urlParams.get('utm_source')   || 'direct',
            utm_medium:   urlParams.get('utm_medium')   || 'none',
            utm_campaign: urlParams.get('utm_campaign') || 'none',
        });

        window.addEventListener('error', (e) => {
            window._logEvent('ar_crash', {
                campaign_id:   urlParams.get('id') || 'unknown',
                crash_message: e.message?.substring(0, 100) || 'unknown',
                crash_file:    e.filename?.substring(0, 100) || 'unknown',
                crash_line:    e.lineno || 0,
                user_agent:    navigator.userAgent?.substring(0, 100) || 'unknown',
            });
        });
        window.addEventListener('unhandledrejection', (e) => {
            window._logEvent('ar_crash', {
                campaign_id:   urlParams.get('id') || 'unknown',
                crash_message: String(e.reason)?.substring(0, 100) || 'unhandled_promise',
                crash_file:    'promise',
                crash_line:    0,
                user_agent:    navigator.userAgent?.substring(0, 100) || 'unknown',
            });
        });
    </script>

    <link rel="preconnect" href="https://aframe.io" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://akm-img-a-in.tosshub.com" crossorigin>
    <link rel="dns-prefetch" href="https://raw.githubusercontent.com">
    <link rel="dns-prefetch" href="https://cdn.aframe.io">



    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; font-family: 'Segoe UI', sans-serif; 
            background-color: #000;
        }
        #loading-overlay {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75); z-index: 150;
            flex-direction: column; justify-content: center; align-items: center; gap: 16px;
        }
        #loading-overlay .spinner {
            width: 48px; height: 48px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top-color: #4185f4;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        #loading-overlay p { color: #fff; font-size: 0.95rem; margin: 0; }

        #scanner-ui {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: none; flex-direction: column; justify-content: center; align-items: center;
            z-index: 50; pointer-events: none;
        }
        .scanner-frame { width: 75vw; height: 75vw; position: relative; display: flex; justify-content: center; align-items: center; flex-direction: column; }
        .scanner-img   { width: 70%; opacity: 0.6; }
        .scanner-line  { position: absolute; width: 100%; height: 4px; background: #a3ff00; top: 0; animation: scan 2s linear infinite; }
        .scanner-label { color: white; font-weight: bold; font-size: 1.1rem; text-shadow: 0 2px 4px #000; letter-spacing: 1px; margin-top: 20px; position: absolute; bottom: -36px; }
        #scanner-ui.no-video .scanner-frame { display: flex; }
        #scanner-ui:not(.no-video) .scanner-frame { display: none; }

        /* ─── mute indicator ─────────────────────────────────────────────────── */
        #mute-overlay {
            position: absolute; inset: 0; border-radius: 18px;
            background: rgba(0,0,0,0.45);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            cursor: pointer; z-index: 10;
            transition: opacity 0.3s ease;
        }
        #mute-overlay .mute-icon {
            width: 64px; height: 64px; border-radius: 50%;
            background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.6);
            display: flex; justify-content: center; align-items: center;
            animation: mutePulse 1.6s ease-in-out infinite;
        }
        #mute-overlay .mute-icon svg { width: 32px; height: 32px; fill: white; }
        #mute-overlay p {
            color: white; font-size: 0.85rem; margin: 10px 0 0 0;
            font-weight: 600; letter-spacing: 0.5px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }
        @keyframes mutePulse {
            0%, 100% { transform: scale(1);   opacity: 1;   }
            50%       { transform: scale(1.1); opacity: 0.7; }
        }
        #video-container {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 85%; z-index: 40; display: none;
            flex-direction: column; justify-content: center; align-items: center;
        }
        #video-wrapper { position: relative; width: 100%; box-shadow: 0 10px 40px rgba(0,0,0,0.8); border-radius: 20px; }
        #video-container video { width: 100%; border: 3px solid #FFF; border-radius: 20px; display: block; }

        #close-sticky {
            position: absolute; top: -15px; right: -15px; width: 40px; height: 40px;
            background: #ff3b30; color: white; border-radius: 50%; border: 2px solid white;
            font-size: 20px; font-weight: bold; cursor: pointer; z-index: 100;
            display: flex; justify-content: center; align-items: center;
            line-height: 1; padding: 0;
        }

        #buy-now-cta {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 280px; height: 70px; display: none; z-index: 60;
            background-size: contain; background-repeat: no-repeat; background-position: center;
        }

        #error-screen {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #1a1a1a; z-index: 200; flex-direction: column; 
            justify-content: center; align-items: center; color: white; text-align: center; padding: 20px;
        }

        #ar-scene-container,
        #ar-scene-container a-scene { position: fixed !important; top: 0 !important; left: 0 !important; width: 100% !important; height: 100% !important; z-index: 0; }
        #ar-scene-container canvas  { position: fixed !important; top: 0 !important; left: 0 !important; width: 100% !important; height: 100% !important; }
        #ar-scene-container video.mindar-video,
        #ar-scene-container video[autoplay] { position: fixed !important; top: 0 !important; left: 0 !important; width: 100% !important; height: 100% !important; object-fit: cover !important; }

        @keyframes scan     { 0% { top: 0; } 100% { top: 100%; } }
        @keyframes spin     { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <p id="loading-msg">Loading AR Experience…</p>
    </div>

    <div id="scanner-ui">
        <div class="scanner-frame">
            <img id="dynamic-scanner-img" src="" class="scanner-img">
            <div class="scanner-line"></div>
            <div class="scanner-label">SCAN THE PRODUCT</div>
        </div>
    </div>

    <div id="video-container">
        <div id="video-wrapper">
            <button id="close-sticky">×</button>
            <!-- mute indicator — shown only while video is muted at start -->
            <div id="mute-overlay">
                <div class="mute-icon">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
                    </svg>
                </div>
                <p>Tap to unmute</p>
            </div>
            <!-- video element will be moved here by JS -->
        </div>
    </div>

    <div id="error-screen">
        <div style="font-size: 50px;">⚠️</div>
        <h2 id="error-title">Campaign Not Found</h2>
        <p id="error-msg">The link might be expired or incorrect.</p>
        <button onclick="location.reload()" style="margin-top:20px; padding:10px 25px; border-radius:20px; border:none; background:#4185f4; color:white; font-weight:bold;">Try Again</button>
    </div>

    <a href="#" target="_blank" id="buy-now-cta"
       onclick="window._logEvent?.('ar_cta_click', { campaign_id: window._campaignId, campaign_name: window._campaignName });"></a>
    <div id="ar-scene-container"></div>


    <script>
        const API_URL = "https://akm-img-a-in.tosshub.com/app/at-app/at_dev/newicons/AR_expierence.json?rnd=" + Math.random() + "#?jnsdk";

        const scannerUi         = document.querySelector('#scanner-ui');
        const dynamicScannerImg = document.querySelector('#dynamic-scanner-img');
        const videoContainer    = document.querySelector('#video-container');
        const videoWrapper      = document.querySelector('#video-wrapper');
        const muteOverlay       = document.querySelector('#mute-overlay');
        const buyNowBtn         = document.querySelector('#buy-now-cta');
        const errorScreen       = document.querySelector('#error-screen');
        const loadingOverlay    = document.querySelector('#loading-overlay');
        const loadingMsg        = document.querySelector('#loading-msg');

        let isStickyEnabled = true;
        let hasFoundOnce    = false;

        // ── Step 1: Load AR scripts eagerly on page load ──────────────────────────
        function loadScript(src) {
            return new Promise((resolve, reject) => {
                if (document.querySelector(`script[src="${src}"]`)) { resolve(); return; }
                const s = document.createElement('script');
                s.src = src; s.onload = resolve; s.onerror = reject;
                document.head.appendChild(s);
            });
        }

        // Start loading AR scripts immediately — no waiting for user
        const arScriptsPromise = (async () => {
            await loadScript('https://aframe.io/releases/1.6.0/aframe.min.js');
            await loadScript('https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js');
        })();

        // ── Step 2: Load campaign JSON in parallel ────────────────────────────────
        const campaignPromise = (async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const targetId  = urlParams.get('id');
            const res = await fetch(API_URL);
            if (!res.ok) throw new Error("API Failure");
            const data = await res.json();
            return targetId
                ? data.find(item => item.id === targetId)
                : data.find(item => item.is_active === true);
        })();

        // ── Step 3: Once BOTH are ready, build AR scene + show video ─────────────
        Promise.all([arScriptsPromise, campaignPromise])
            .then(([_, campaign]) => {
                if (!campaign) { errorScreen.style.display = 'flex'; return; }

                // Apply campaign config
                window._campaignId   = campaign.id;
                window._campaignName = campaign.campaignName;
                dynamicScannerImg.src = campaign.scannerImg;
                if (campaign.CTAimgUrl)       buyNowBtn.style.backgroundImage = `url('${campaign.CTAimgUrl}')`;
                if (campaign.clickTrackerUrl) buyNowBtn.href = campaign.clickTrackerUrl;
                else if (campaign.CTAredirectUrl) buyNowBtn.href = campaign.CTAredirectUrl;

                window._logEvent?.('ar_session_start', {
                    campaign_id:   campaign.id,
                    campaign_name: campaign.campaignName,
                });

                document.body.style.backgroundColor            = 'transparent';
                document.documentElement.style.backgroundColor = 'transparent';

                buildARScene(campaign);
            })
            .catch(err => {
                console.error('Init error:', err);
                errorScreen.style.display = 'flex';
            });

        // ── buildARScene ──────────────────────────────────────────────────────────
        function buildARScene(campaign) {

            AFRAME.registerComponent('force-front-facing', {
                init()       { this._active = false; },
                activate()   { this._active = true; },
                deactivate() { this._active = false; },
                tick()       { if (this._active) this.el.object3D.quaternion.set(0, 0, 0, 1); }
            });

            document.querySelector('#ar-scene-container').innerHTML = `
                <a-scene
                    id="ar-scene"
                    embedded
                    mindar-image="autoStart: false; uiScanning: #none; filterMinCF: 0.001; filterBeta: 0.001; missTolerance: 10;"
                    device-orientation-permission-ui="enabled: false"
                    vr-mode-ui="enabled: false"
                    renderer="antialias: true; colorManagement: true;">
                    <a-assets timeout="10000"></a-assets>
                    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
                    <a-entity mindar-image-target="targetIndex: 0" id="target-entity">
                        <a-text
                            id="ar-text-ui"
                            value="${campaign.campaignName.toUpperCase()}"
                            align="center" color="#FFFFFF" negate="false"
                            scale="0.8 0.8 0.8" position="0 1.25 0.1"
                            font="https://cdn.aframe.io/fonts/DejaVu-sdf.fnt"
                            force-front-facing>
                        </a-text>
                        <a-video id="ar-video-renderer" src="#myVideo" visible="false" position="0 0 0.1"></a-video>
                    </a-entity>
                </a-scene>`;

            const sceneEl         = document.querySelector('#ar-scene');
            const arVideoRenderer = document.querySelector('#ar-video-renderer');
            const arTextUI        = document.querySelector('#ar-text-ui');
            const aAssets         = document.querySelector('a-assets');

            // ── Create video, place in floating container, play muted ─────────────
            const video = document.createElement('video');
            video.id    = 'myVideo';
            video.src   = campaign.videoUrl;
            video.loop  = true;
            video.muted = true;   // muted for autoplay; user taps overlay to unmute
            video.setAttribute('crossorigin',       'anonymous');
            video.setAttribute('playsinline',       '');
            video.setAttribute('webkit-playsinline','');
            video.style.cssText = 'width:100%; border:3px solid #FFF; border-radius:20px; display:block;';

            videoWrapper.appendChild(video);
            videoContainer.style.display = 'flex';  // show immediately
            video.load();
            video.play().catch(e => console.warn('[autoplay]', e));

            // ── Mute overlay: tap once to unmute, never shown again ───────────────
            let hasUnmutedOnce = false;
            muteOverlay.addEventListener('click', () => {
                if (hasUnmutedOnce) return;
                hasUnmutedOnce             = true;
                video.muted                = false;
                muteOverlay.style.opacity  = '0';
                muteOverlay.style.pointerEvents = 'none';
                setTimeout(() => { muteOverlay.style.display = 'none'; }, 300);
            });

            // ── Plane sizing ──────────────────────────────────────────────────────
            function applyPlaneSize(w, h) {
                const pw = 1, ph = pw * (h / w);
                arVideoRenderer.setAttribute('width',  pw);
                arVideoRenderer.setAttribute('height', ph);
            }
            (async () => {
                if (campaign.targetImageWidth && campaign.targetImageHeight) {
                    applyPlaneSize(campaign.targetImageWidth, campaign.targetImageHeight); return;
                }
                const dims = await new Promise(resolve => {
                    const img = new Image(); img.crossOrigin = 'anonymous';
                    img.src = campaign.scannerImg || campaign.targetImageUrl || '';
                    img.onload  = () => resolve({ w: img.naturalWidth, h: img.naturalHeight });
                    img.onerror = () => resolve(null);
                });
                if (dims) { applyPlaneSize(dims.w, dims.h); return; }
                video.addEventListener('loadedmetadata', () => {
                    applyPlaneSize(video.videoWidth, video.videoHeight);
                }, { once: true });
            })();

            sceneEl.setAttribute('mindar-image', {
                imageTargetSrc: campaign.mindUrl,
                autoStart: false, uiScanning: '#none'
            });

            // ── AR camera ready ───────────────────────────────────────────────────
            let arStarted = false;
            function startARTracking() {
                if (arStarted) return;
                arStarted = true;
                loadingOverlay.style.display = 'none';
                // No scanner shown here — video container is already visible
                window._logEvent?.('ar_ready', { campaign_id: campaign.id });
                const arSystem = sceneEl.systems['mindar-image-system'];
                if (arSystem) arSystem.start();
            }

            sceneEl.addEventListener('renderstart', startARTracking, { once: true });
            const readyPoll = setInterval(() => {
                if (sceneEl.hasLoaded || sceneEl.renderStarted) {
                    clearInterval(readyPoll); startARTracking();
                }
            }, 200);
            setTimeout(() => { clearInterval(readyPoll); startARTracking(); }, 3000);

            // ── Analytics ─────────────────────────────────────────────────────────
            const targetEntity   = document.querySelector('#target-entity');
            let impressionFired  = false;
            let videoMilestones  = new Set();
            const pageLoadTime   = Date.now();
            let arReadyTime      = null;
            let targetFoundTime  = null;
            sceneEl.addEventListener('renderstart', () => { arReadyTime = Date.now(); }, { once: true });

            // ── TARGET FOUND ──────────────────────────────────────────────────────
            targetEntity.addEventListener('targetFound', () => {
                hasFoundOnce    = true;
                isStickyEnabled = true;
                targetFoundTime = Date.now();

                // Hide floating container
                videoContainer.style.display = 'none';
                scannerUi.style.display      = 'none';
                buyNowBtn.style.display      = 'block';

                // Move video to a-assets for AR texture
                aAssets.appendChild(video);
                arVideoRenderer.setAttribute('src',     '#myVideo');
                arVideoRenderer.setAttribute('visible', 'true');
                arTextUI.setAttribute('visible',        'true');
                arTextUI.components['force-front-facing']?.activate();

                // Auto-unmute on target found if user hasn't tapped yet
                if (!hasUnmutedOnce) {
                    hasUnmutedOnce            = true;
                    muteOverlay.style.display = 'none';
                }
                video.muted = false;
                if (video.paused) video.play();

                // Impression tracker
                if (!impressionFired && campaign.impressionTrackerUrl) {
                    const fire = () => {
                        impressionFired = true;
                        const imp = new Image();
                        imp.src = campaign.impressionTrackerUrl.replace('[timestamp]', Date.now()) + '&rnd=' + Math.random();
                        video.removeEventListener('playing', fire);
                        window._logEvent?.('ar_video_play', {
                            campaign_id:     campaign.id,
                            campaign_name:   campaign.campaignName,
                            time_to_scan_ms: arReadyTime ? (targetFoundTime - arReadyTime) : null,
                            time_to_load_ms: Date.now() - pageLoadTime,
                        });
                    };
                    video.addEventListener('playing', fire);
                }

                // Progress milestones
                video.addEventListener('timeupdate', () => {
                    if (!video.duration) return;
                    const pct = (video.currentTime / video.duration) * 100;
                    for (const m of [0, 10, 25, 50, 75, 100]) {
                        if (pct >= m && !videoMilestones.has(m)) {
                            videoMilestones.add(m);
                            window._logEvent?.('ar_video_progress', {
                                campaign_id: campaign.id, campaign_name: campaign.campaignName, percent: m,
                            });
                        }
                    }
                });
            });

            // ── TARGET LOST ───────────────────────────────────────────────────────
            targetEntity.addEventListener('targetLost', () => {
                arTextUI.components['force-front-facing']?.deactivate();

                if (hasFoundOnce && isStickyEnabled) {
                    arVideoRenderer.setAttribute('visible', 'false');
                    arTextUI.setAttribute('visible',        'false');
                    // Move video back to floating container — seamless continue
                    videoContainer.style.display = 'flex';
                    videoWrapper.appendChild(video);
                    if (video.paused) video.play();
                } else {
                    video.pause();
                    scannerUi.classList.add('no-video');
                    scannerUi.style.display = 'flex';
                }
            });

            // ── Close sticky ──────────────────────────────────────────────────────
            document.querySelector('#close-sticky').addEventListener('click', (e) => {
                e.stopPropagation();
                isStickyEnabled              = false;
                videoContainer.style.display = 'none';
                scannerUi.classList.add('no-video');
                scannerUi.style.display      = 'flex';
                video.pause();
                aAssets.appendChild(video);
            });

            document.addEventListener('visibilitychange', () => {
                if (document.hidden) video.pause();
            });
        }
    </script>
</body>
</html>
